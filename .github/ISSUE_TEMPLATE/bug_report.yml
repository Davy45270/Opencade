name: Report a bug
description: A game is not behaving as expected.
labels: [bug]
body:
  - type: input
    id: jeu
    attributes:
      label: Affected game
      placeholder: "e.g. Empilo, level 12"
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Device and browser
      placeholder: "e.g. Android 15, Chrome 142; or Windows 11, Firefox"
    validations:
      required: true
  - type: dropdown
    id: controle
    attributes:
      label: Input method
      multiple: true
      options: [Touch, Mouse, Keyboard]
  - type: textarea
    id: capture
    attributes:
      label: Screenshot or console errors (optional)
