name: Suggest an idea
description: An improvement, a gameplay adjustment or a new game.
labels: [enhancement]
body:
  - type: textarea
    id: idee
    attributes:
      label: Your idea
      description: What you would like to see, and why.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details (optional)
      description: Affected game, controls and examples.
  - type: checkboxes
    id: originalite
    attributes:
      label: Originality
      options:
        - label: This idea does not reuse names, characters, artwork or levels from an existing game.
          required: true
