name: Proposer une idée
description: Une amélioration, un réglage de jouabilité ou un nouveau jeu.
labels: [enhancement]
body:
  - type: textarea
    id: idee
    attributes:
      label: L'idée
      description: Ce que vous aimeriez, et pourquoi.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Détails (facultatif)
      description: Jeu concerné, contrôles, exemples.
  - type: checkboxes
    id: originalite
    attributes:
      label: Originalité
      options:
        - label: L'idée ne reprend ni nom, ni personnage, ni graphisme, ni niveau d'un jeu existant.
          required: true
