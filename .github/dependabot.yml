version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The two pairs that must move together are left to Renovate (renovate.json, on the Forgejo copy):
    # @playwright/test with the CI image mcr.microsoft.com/playwright, @types/node with the CI node image.
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "@types/node"
    groups:
      outillage:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
